name: CI
on: push
jobs:
  build-backend:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quotes
          POSTGRES_PASSWORD: quotes
          POSTGRES_DB: quotes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quotes -d quotes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build the backend Docker image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/quotes-backend:${{ github.sha }} \
            ./backend
 
      - name: Push the backend Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/quotes-backend:${{ github.sha }}
 