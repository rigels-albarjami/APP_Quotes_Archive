name: CI
on: push
jobs:
  build-backend:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quotes
          POSTGRES_PASSWORD: quotes
          POSTGRES_DB: quotes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quotes -d quotes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/quotes-backend:${{ github.sha }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Build the backend Docker image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t "$IMAGE" \
            ./backend

      - name: Smoke test - start the image and call the API
        run: |
          docker run -d --name quotes-backend --network host \
            -e DB_USER=quotes \
            -e DB_PASSWORD=quotes \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=quotes \
            "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ > response.json; then
              echo "Backend answered after ${i}s"
              break
            fi
            sleep 1
          done

          cat response.json
          grep -q "Quotes Archive API is running" response.json

      - name: Show backend logs if the smoke test failed
        if: failure()
        run: docker logs quotes-backend

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the backend Docker image
        if: github.ref == 'refs/heads/master'
        run: docker push "$IMAGE"